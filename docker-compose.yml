# Local development services. Run: docker compose up -d
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gjubrarko
      POSTGRES_USER: gjubrarko
      POSTGRES_PASSWORD: gjubrarko
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]

  # S3-compatible photo storage. The API creates the bucket on start in Development.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - storage-data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

  mail:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

volumes:
  db-data:
  storage-data:
