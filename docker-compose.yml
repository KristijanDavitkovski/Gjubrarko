# Local development services. Run: docker compose up -d
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gjubrarko
      POSTGRES_USER: gjubrarko
      POSTGRES_PASSWORD: gjubrarko
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gjubrarko
      MINIO_ROOT_PASSWORD: gjubrarko-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  # Creates the photo bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 gjubrarko gjubrarko-secret; do sleep 1; done;
      mc mb --ignore-existing local/gjubrarko-photos"

  mail:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

volumes:
  db-data:
  minio-data:
